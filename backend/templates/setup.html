<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamGrab Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8E2DE2;
            --secondary: #4A00E0;
            --bg: #0F0C29;
            --card-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0F0C29, #302B63, #24243E);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #ccc;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 16px;
        }
        button:hover {
            transform: scale(1.02);
        }
        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StreamGrab Setup</h1>
        <p>Configure your environment and API keys.</p>
        
        <form id="setupForm">
            <div class="form-group">
                <label>DeepSeek API Key</label>
                <input type="password" name="deepseek_key" value="{{ deepseek_key }}" placeholder="sk-...">
            </div>
            
            <div class="form-group">
                <label>Telegram Bot Token</label>
                <input type="password" name="telegram_token" value="{{ telegram_token }}" placeholder="123456:ABC...">
            </div>
            
            <div class="form-group">
                <label>Telegram Chat ID</label>
                <input type="text" name="chat_id" value="{{ chat_id }}" placeholder="-100...">
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" name="drive_enabled" id="drive_enabled" {% if drive_enabled %}checked{% endif %}>
                <label for="drive_enabled" style="margin-bottom: 0;">Enable Google Drive Upload</label>
            </div>
            
            <button type="submit">Save Configuration</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        document.getElementById('setupForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const statusDiv = document.getElementById('status');
            
            statusDiv.style.display = 'block';
            statusDiv.innerText = 'Saving...';
            statusDiv.style.color = '#aaa';

            try {
                const response = await fetch('/save-config', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.innerText = '✅ ' + result.message;
                    statusDiv.style.color = '#4CAF50';
                } else {
                    statusDiv.innerText = '❌ ' + result.detail;
                    statusDiv.style.color = '#F44336';
                }
            } catch (err) {
                statusDiv.innerText = '❌ Failed to connect to server';
                statusDiv.style.color = '#F44336';
            }
        };
    </script>
</body>
</html>
